<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị (Admin)</title>
    <style>
        body { font-family: "Times New Roman", Times, serif; margin: 20px; background-color: #f4f7f6; font-size: 13px; }
        .container { max-width: 1050px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; font-size: 20px; }
        #login-section { max-width: 400px; margin: 100px auto; text-align: center; }
        #login-section input { width: 100%; box-sizing: border-box; margin-bottom: 15px; padding: 10px; font-size: 16px; }
        #login-section button { width: 100%; background-color: #007bff; padding: 12px; font-size: 16px; color:white; border:none; border-radius:4px; cursor:pointer;}
        .controls { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .form-column { display: flex; flex-direction: column; flex: 1; min-width: 250px; gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        textarea { height: 180px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; font-family: "Times New Roman", Times, serif; font-size: 13px;}
        input[type="number"], input[type="text"], input[type="password"], select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: "Times New Roman", Times, serif;}
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        button { flex: 1; padding: 10px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; font-family: "Times New Roman", Times, serif; transition: 0.2s; }
        .btn-generate { background-color: #28a745; } .btn-generate:hover { background-color: #218838; }
        .btn-next { background-color: #17a2b8; } .btn-next:hover { background-color: #138496; }
        .btn-stats { background-color: #6c757d; } .btn-stats:hover { background-color: #5a6268; }
        .btn-print { background-color: #ffc107; color: #333; } .btn-print:hover { background-color: #e0a800; }
        .action-bar { display: flex; gap: 10px; margin-top: 10px; }
        .data-management { flex: 2; background-color: #e9ecef; padding: 10px; border-radius: 4px; border: 1px dashed #ccc; display: flex; align-items: center; gap: 10px; }
        .data-management select { flex: 1; } .data-management button { width: auto; background-color: #007bff; }
        .admin-header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .btn-logout { background-color: #dc3545; padding: 6px 12px; font-size: 12px; }
        .btn-change-pass { background-color: #6f42c1; padding: 6px 12px; font-size: 12px; }
        .table-container { overflow-x: auto; margin-top: 20px; }
        table { border-collapse: collapse; width: 100%; font-size: 13px; font-family: "Times New Roman", Times, serif; }
        th, td { border: 1px solid #000; padding: 5px; text-align: center; height: 25px; user-select: none; }
        th { background-color: #f2f2f2; }
        .weekend { background-color: #9bc2e6; } .holiday { background-color: #f4b084; } .missed { background-color: #f8d7da; color: #dc3545; }
        .name-col { text-align: left; font-weight: bold; white-space: nowrap; padding-left: 10px; }
        .note-text { font-size: 13px; color: #666; margin-top: 5px; font-style: italic; }
        #next-month-info { margin-top: 15px; text-align: right; font-weight: bold; color: #d9534f; font-size: 13px;}
        .stats-box { display: none; margin-top: 20px; background: #fff3cd; padding: 15px; border-left: 5px solid #ffc107; border-radius: 4px; }
        .clickable-cell:hover { background-color: #e2e6ea; cursor: pointer; }
        #save-status { margin-left: 10px; font-size: 13px; font-weight: bold; color: #28a745; display: none; }
    </style>
</head>
<body>

<div class="container" id="login-section">
    <h2>ĐĂNG NHẬP QUẢN TRỊ</h2>
    <input type="password" id="admin-pass-input" placeholder="Nhập mật khẩu..." onkeypress="handleLoginKeyPress(event)">
    <button onclick="verifyLogin()">Đăng Nhập</button>
    <p style="font-size: 13px; color: #666; margin-top: 15px;">Mật khẩu mặc định: <b>admin123</b></p>
    <div style="margin-top: 20px;"><a href="index.html" style="color: #007bff; text-decoration: none; font-size: 14px;">Quay lại trang xem lịch chung</a></div>
</div>

<div class="container" id="main-admin-section" style="display: none;">
    <div class="admin-header-actions">
        <div><a href="index.html" target="_blank" style="color: #007bff; text-decoration: none; font-weight: bold; border: 1px solid #007bff; padding: 5px 10px; border-radius: 4px;">👁️ Mở Trang Hiển Thị</a></div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-change-pass" onclick="changePassword()">🔑 Đổi Mật Khẩu</button>
            <button class="btn-logout" onclick="logoutAdmin()">🚪 Đăng Xuất</button>
        </div>
    </div>

    <h2>CÔNG CỤ PHÂN LỊCH TRỰC NHẬT <span id="save-status">✓ Đã lưu lên Mây</span></h2>
    
    <div class="controls">
        <div class="form-column">
            <div class="form-group">
                <label for="names">Danh sách nhân sự (Mỗi dòng 1 tên):</label>
                <textarea id="names" oninput="updateStartPersonList()">Nguyễn Tiến Chiến Thắng
Đỗ Ngọc Điền
Trịnh Quang Long
Hoàng Đức Hải
Nguyễn Như Hoàng Anh
Lê Thanh Trúc
Phạm Tiến Dũng
Vũ Đình Dũng
Bùi Xuân Long
Nguyễn Thị Lan
Lê Duy
Hoàng Hải Hưng</textarea>
            </div>
        </div>

        <div class="form-column">
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label for="month">Tháng:</label>
                    <input type="number" id="month" value="4" min="1" max="12">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="year">Năm:</label>
                    <input type="number" id="year" value="2026" min="2020" max="2050">
                </div>
            </div>
            <div class="form-group"><label for="startPerson">Người bắt đầu trực:</label><select id="startPerson"></select></div>
            <div class="form-group"><label for="holidays">Các ngày nghỉ lễ trong tháng:</label><input type="text" id="holidays" placeholder="VD: 18, 30" value=""></div>

            <div class="btn-group">
                <button class="btn-generate" onclick="generateAndSaveNewSchedule()">Tạo & Lưu Lên Mây</button>
                <button class="btn-next" onclick="generateNextMonth()">Tháng Tiếp Theo >></button>
            </div>
            
            <div class="action-bar">
                <div class="data-management">
                    <label style="font-size:13px; font-weight:bold;">Xem lại lịch cũ:</label>
                    <select id="savedMonths"></select>
                    <button onclick="loadSelectedSchedule()">Tải Lịch</button>
                </div>
            </div>
            <div class="action-bar"><button class="btn-stats" onclick="toggleStats()">Xem Thống Kê</button><button class="btn-print" onclick="window.print()">🖨️ In Lịch</button></div>
        </div>
    </div>

    <div class="stats-box" id="stats-box"><h4>Thống kê số lần không trực nhật</h4><ul id="stats-list"></ul></div>
    <div class="table-container" id="output"></div>
    <div id="next-month-info"></div>
</div>

<script>
    // 👇👇 BẠN HÃY DÁN LINK WEB APP GIỐNG HỆT NHƯ Ở INDEX.HTML VÀO ĐÂY 👇👇
    const API_URL = 'https://script.google.com/macros/s/AKfycbyv7wUG2R0Nq84FUGdGYeen051QGcKk-kLD0pmaKx2cmDPBO04ZCCZ0s_zNH5ekxbdycQ/exec';
    const PASS_KEY = 'admin_password_secret'; 
    let currentMonthData = null; 
    let cloudData = {}; // Thay thế localStorage

    window.onload = function() {
        if (sessionStorage.getItem('isAdminLoggedIn') === 'true') showAdminWorkspace();
    };

    function handleLoginKeyPress(e) { if (e.key === 'Enter') verifyLogin(); }
    function verifyLogin() {
        let inputPass = document.getElementById('admin-pass-input').value;
        let correctPass = localStorage.getItem(PASS_KEY) || 'admin123';
        if (inputPass === correctPass) { sessionStorage.setItem('isAdminLoggedIn', 'true'); showAdminWorkspace(); }
        else { alert('❌ Sai mật khẩu!'); }
    }
    function logoutAdmin() { sessionStorage.removeItem('isAdminLoggedIn'); location.reload(); }
    function changePassword() {
        let currentCorrectPass = localStorage.getItem(PASS_KEY) || 'Den.1309@';
        let oldPass = prompt('Nhập mật khẩu HIỆN TẠI:'); if (oldPass === null) return;
        if (oldPass !== currentCorrectPass) { alert('❌ Sai!'); return; }
        let newPass = prompt('Nhập mật khẩu MỚI:'); if (!newPass) return;
        let confirmPass = prompt('Nhập LẠI:'); if (confirmPass !== newPass) { alert('❌ Không khớp!'); return; }
        localStorage.setItem(PASS_KEY, newPass); alert('✅ Thành công!');
    }

    async function showAdminWorkspace() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('main-admin-section').style.display = 'block';
        document.getElementById('output').innerHTML = "<h3 style='text-align:center;'>⏳ Đang kết nối với Google Sheets để tải dữ liệu...</h3>";
        
        updateStartPersonList();
        
        try {
            let res = await fetch(API_URL);
            cloudData = await res.json();
            updateSavedMonthsDropdown();
            
            let m = document.getElementById('month').value;
            let y = document.getElementById('year').value;
            let id = `${y}-${m.padStart(2, '0')}`;
            
            if (cloudData[id]) {
                currentMonthData = cloudData[id];
                renderTableFromData();
            } else {
                generateAndSaveNewSchedule();
            }
        } catch(e) {
            alert('Lỗi tải dữ liệu. Vui lòng F5 lại!');
            console.error(e);
        }
    }

    function updateStartPersonList() {
        const names = document.getElementById('names').value.split('\n').map(n => n.trim()).filter(n => n !== '');
        const select = document.getElementById('startPerson');
        const currentSelection = select.value;
        select.innerHTML = '';
        names.forEach(name => { select.appendChild(new Option(name, name)); });
        if (names.includes(currentSelection)) select.value = currentSelection;
    }

    function updateSavedMonthsDropdown() {
        const select = document.getElementById('savedMonths'); select.innerHTML = '';
        let keys = Object.keys(cloudData).sort().reverse(); 
        if (keys.length === 0) { select.appendChild(new Option("Chưa có dữ liệu", "")); return; }
        keys.forEach(key => { select.appendChild(new Option(`Tháng ${cloudData[key].month}/${cloudData[key].year}`, key)); });
    }

    async function saveDataToCloud() {
        cloudData[currentMonthData.id] = currentMonthData; // Lưu tạm hiển thị
        let status = document.getElementById('save-status');
        status.style.display = 'inline-block';
        status.style.color = 'orange';
        status.innerText = "⏳ Đang đẩy lên mây...";
        
        try {
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(currentMonthData),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });
            status.style.color = '#28a745';
            status.innerText = "✓ Đã lưu lên mây!";
            setTimeout(() => { status.style.display = 'none'; }, 3000);
        } catch (e) {
            status.style.color = 'red';
            status.innerText = "❌ Lỗi lưu!";
            alert("Đã xảy ra lỗi khi lưu lên Google Sheets!");
        }
    }

    function generateAndSaveNewSchedule() {
        const names = document.getElementById('names').value.split('\n').map(n => n.trim()).filter(n => n !== '');
        const month = parseInt(document.getElementById('month').value); const year = parseInt(document.getElementById('year').value);
        const startPersonName = document.getElementById('startPerson').value;
        const holidayDates = document.getElementById('holidays').value.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
        if (names.length === 0) return;
        const daysInMonth = new Date(year, month, 0).getDate();
        let assignments = {}; let missed = {}; 
        names.forEach(n => { assignments[n] = {}; missed[n] = {}; });
        
        let currentIdx = names.indexOf(startPersonName); if (currentIdx === -1) currentIdx = 0;
        let isWeekend = []; let isHoliday = [];

        for (let i = 1; i <= daysInMonth; i++) {
            let day = new Date(year, month - 1, i).getDay();
            let weekend = (day === 0 || day === 6); let holiday = holidayDates.includes(i);
            isWeekend[i] = weekend; isHoliday[i] = holiday;
            if (!weekend && !holiday) {
                assignments[names[currentIdx]][i] = true;
                currentIdx = (currentIdx + 1) % names.length; 
            }
        }
        currentMonthData = {
            id: `${year}-${month.toString().padStart(2, '0')}`, month: month, year: year, names: names, daysInMonth: daysInMonth,
            isWeekend: isWeekend, isHoliday: isHoliday, assignments: assignments, missed: missed, nextPersonForNextMonth: names[currentIdx]
        };

        renderTableFromData();
        updateSavedMonthsDropdown();
        saveDataToCloud(); // Gọi hàm lưu lên mây
    }

    function renderTableFromData() {
        if (!currentMonthData) return;
        const { month, year, names, daysInMonth, isWeekend, isHoliday, assignments, missed, nextPersonForNextMonth } = currentMonthData;
        let html = `<table><tr><th colspan="${daysInMonth + 1}" style="font-size: 16px; padding: 10px;">BẢNG PHÂN CÔNG TRỰC NHẬT THÁNG ${month}/${year}</th></tr>`;
        html += `<tr><th rowspan="2" class="name-col" style="width: 200px;">Họ và tên</th>`;
        for (let i = 1; i <= daysInMonth; i++) html += `<th>${i < 10 ? '0'+i : i}</th>`;
        html += `</tr><tr>`;
        for (let i = 1; i <= daysInMonth; i++) {
            let day = new Date(year, month - 1, i).getDay();
            let dayStr = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][day];
            html += `<th ${isHoliday[i] ? 'class="holiday"' : (isWeekend[i] ? 'class="weekend"' : '')}>${dayStr}</th>`;
        }
        html += `</tr>`;
        names.forEach(name => {
            html += `<tr><td class="name-col">${name}</td>`;
            for (let i = 1; i <= daysInMonth; i++) {
                let tdClass = isHoliday[i] ? 'holiday' : (isWeekend[i] ? 'weekend' : '');
                let isAssigned = assignments[name] && assignments[name][i];
                let isMissed = missed[name] && missed[name][i];
                let mark = '', onClick = '';
                if (isAssigned) {
                    mark = `<b>${isMissed ? 'Vắng' : 'X'}</b>`;
                    onClick = `onclick="toggleMissed('${name}', ${i})" class="clickable-cell ${tdClass} ${isMissed ? 'missed' : ''}"`;
                } else { onClick = `class="${tdClass}"`; }
                html += `<td ${onClick}>${mark}</td>`;
            }
            html += `</tr>`;
        });
        html += `</table><div class="note-text"><i>* Nhấp chuột vào chữ <b>X</b> để đánh dấu là <b>Vắng</b>. Lịch sẽ tự lưu lên Mây.</i></div>`;
        document.getElementById('output').innerHTML = html;
        document.getElementById('next-month-info').innerHTML = `Người trực ca đầu tiên của tháng sau sẽ là <b>${nextPersonForNextMonth}</b>`;
    }

    function toggleMissed(name, day) {
        if (!currentMonthData.missed[name]) currentMonthData.missed[name] = {};
        currentMonthData.missed[name][day] = !currentMonthData.missed[name][day];
        renderTableFromData(); 
        saveDataToCloud(); // Lưu luôn khi có người vắng
    }

    function loadSelectedSchedule() {
        let selectedId = document.getElementById('savedMonths').value;
        if (!selectedId || !cloudData[selectedId]) return;
        currentMonthData = cloudData[selectedId];
        document.getElementById('month').value = currentMonthData.month;
        document.getElementById('year').value = currentMonthData.year;
        document.getElementById('names').value = currentMonthData.names.join('\n');
        
        let holidaysStr = [];
        for (let i=1; i<=currentMonthData.daysInMonth; i++) { if(currentMonthData.isHoliday[i]) holidaysStr.push(i); }
        document.getElementById('holidays').value = holidaysStr.join(', ');
        
        updateStartPersonList(); renderTableFromData();
    }

    function generateNextMonth() {
        if (!currentMonthData) return;
        let m = currentMonthData.month + 1, y = currentMonthData.year;
        if (m > 12) { m = 1; y++; }
        document.getElementById('month').value = m; document.getElementById('year').value = y;
        document.getElementById('holidays').value = ""; 
        document.getElementById('startPerson').value = currentMonthData.nextPersonForNextMonth; 
        generateAndSaveNewSchedule();
    }
    
    function toggleStats() { /* Phần thống kê tạm thời giữ nguyên */ }
</script>
</body>
</html>
