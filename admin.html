<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung tâm Công nghệ thông tin - Đại học Phenikaa</title>
    <style>
        /* Đổi toàn bộ font chữ sang Times New Roman */
        body { font-family: "Times New Roman", Times, serif; margin: 20px; background-color: #f4f7f6; font-size: 13px; }
        .container { max-width: 1050px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; font-size: 20px; }
        
        /* Giao diện Đăng nhập */
        #login-section { max-width: 400px; margin: 100px auto; text-align: center; }
        #login-section input { width: 100%; box-sizing: border-box; margin-bottom: 15px; padding: 10px; font-size: 16px; }
        #login-section button { width: 100%; background-color: #007bff; padding: 12px; font-size: 16px; }
        #login-section button:hover { background-color: #0056b3; }

        /* Giao diện Admin */
        .controls { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .form-column { display: flex; flex-direction: column; flex: 1; min-width: 250px; gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        
        textarea { height: 180px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; font-family: "Times New Roman", Times, serif; font-size: 13px;}
        input[type="number"], input[type="text"], input[type="password"], select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: "Times New Roman", Times, serif;}
        
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        button { flex: 1; padding: 10px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; font-family: "Times New Roman", Times, serif; transition: 0.2s; }
        .btn-generate { background-color: #28a745; }
        .btn-generate:hover { background-color: #218838; }
        .btn-next { background-color: #17a2b8; }
        .btn-next:hover { background-color: #138496; }
        .btn-stats { background-color: #6c757d; }
        .btn-stats:hover { background-color: #5a6268; }
        .btn-print { background-color: #ffc107; color: #333; }
        .btn-print:hover { background-color: #e0a800; }
        
        .action-bar { display: flex; gap: 10px; margin-top: 10px; }
        .data-management { flex: 2; background-color: #e9ecef; padding: 10px; border-radius: 4px; border: 1px dashed #ccc; display: flex; align-items: center; gap: 10px; }
        .data-management select { flex: 1; }
        .data-management button { width: auto; background-color: #007bff; }
        .data-management button:hover { background-color: #0056b3; }

        .admin-header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .btn-logout { background-color: #dc3545; padding: 6px 12px; font-size: 12px; }
        .btn-logout:hover { background-color: #c82333; }
        .btn-change-pass { background-color: #6f42c1; padding: 6px 12px; font-size: 12px; }
        .btn-change-pass:hover { background-color: #5a32a3; }

        .table-container { overflow-x: auto; margin-top: 20px; }
        table { border-collapse: collapse; width: 100%; font-size: 13px; font-family: "Times New Roman", Times, serif; }
        th, td { border: 1px solid #000; padding: 5px; text-align: center; height: 25px; user-select: none; }
        th { background-color: #f2f2f2; }
        .weekend { background-color: #9bc2e6; } 
        .holiday { background-color: #f4b084; } 
        .missed { background-color: #f8d7da; color: #dc3545; }
        .name-col { text-align: left; font-weight: bold; white-space: nowrap; padding-left: 10px; }
        .note-text { font-size: 13px; color: #666; margin-top: 5px; font-style: italic; }
        #next-month-info { margin-top: 15px; text-align: right; font-weight: bold; color: #d9534f; font-size: 13px;}
        
        .stats-box { display: none; margin-top: 20px; background: #fff3cd; padding: 15px; border-left: 5px solid #ffc107; border-radius: 4px; }
        .stats-box ul { margin: 10px 0 0 0; padding-left: 20px; }
        .stats-box li { margin-bottom: 5px; font-size: 13px; }
        .clickable-cell:hover { background-color: #e2e6ea; cursor: pointer; }

        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body { background-color: white; margin: 0; padding: 0; font-family: "Times New Roman", Times, serif; }
            .container { box-shadow: none; padding: 0; max-width: 100%; border: none; }
            .controls, .action-bar, .admin-header-actions, #next-month-info, .stats-box, h2, .note-text { display: none !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            table { font-size: 13px; width: 100%; font-family: "Times New Roman", Times, serif; }
            th, td { padding: 4px; border: 1px solid #000 !important; }
        }
    </style>
</head>
<body>

<div class="container" id="login-section">
    <h2>ĐĂNG NHẬP QUẢN TRỊ</h2>
    <input type="password" id="admin-pass-input" placeholder="Nhập mật khẩu..." onkeypress="handleLoginKeyPress(event)">
    <button onclick="verifyLogin()">Đăng Nhập</button>
    <div style="margin-top: 20px;">
        <a href="index.html" style="color: #007bff; text-decoration: none; font-size: 14px;">Quay lại trang xem lịch chung</a>
    </div>
</div>

<div class="container" id="main-admin-section" style="display: none;">
    <div class="admin-header-actions">
        <div>
            <a href="index.html" target="_blank" style="color: #007bff; text-decoration: none; font-weight: bold; border: 1px solid #007bff; padding: 5px 10px; border-radius: 4px;">👁️ Mở Trang Hiển Thị (Cho Mọi Người)</a>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-change-pass" onclick="changePassword()">🔑 Đổi Mật Khẩu</button>
            <button class="btn-logout" onclick="logoutAdmin()">🚪 Đăng Xuất</button>
        </div>
    </div>

    <h2>CÔNG CỤ PHÂN LỊCH TRỰC NHẬT & THỐNG KÊ</h2>
    
    <div class="controls">
        <div class="form-column">
            <div class="form-group">
                <label for="names">Danh sách nhân sự (Mỗi dòng 1 tên):</label>
                <textarea id="names" oninput="updateStartPersonList()">Nguyễn Tiến Chiến Thắng
Đỗ Ngọc Điền
Trịnh Quang Long
Hoàng Đức Hải
Nguyễn Như Hoàng Anh
Lê Thanh Trúc
Phạm Tiến Dũng
Vũ Đình Dũng
Bùi Xuân Long
Nguyễn Thị Lan
Lê Duy
Hoàng Hải Hưng</textarea>
            </div>
        </div>

        <div class="form-column">
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label for="month">Tháng:</label>
                    <input type="number" id="month" value="4" min="1" max="12">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="year">Năm:</label>
                    <input type="number" id="year" value="2026" min="2020" max="2050">
                </div>
            </div>

            <div class="form-group">
                <label for="startPerson">Người bắt đầu trực (Ngày làm việc đầu tiên):</label>
                <select id="startPerson"></select>
            </div>

            <div class="form-group">
                <label for="holidays">Các ngày nghỉ lễ trong tháng (nếu có):</label>
                <input type="text" id="holidays" placeholder="VD: 18, 30" value="">
            </div>

            <div class="btn-group">
                <button class="btn-generate" onclick="generateAndSaveNewSchedule()">Tạo Lịch Mới</button>
                <button class="btn-next" onclick="generateNextMonth()">Tháng Tiếp Theo >></button>
            </div>
            
            <div class="action-bar">
                <div class="data-management">
                    <label style="font-size:13px; font-weight:bold;">Xem lại lịch cũ:</label>
                    <select id="savedMonths"></select>
                    <button onclick="loadSelectedSchedule()">Tải Lịch</button>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn-stats" onclick="toggleStats()">Xem Thống Kê</button>
                <button class="btn-print" onclick="window.print()">🖨️ In Lịch (A4 Ngang)</button>
            </div>
        </div>
    </div>

    <div class="stats-box" id="stats-box">
        <h4>Thống kê số lần không trực nhật (Tổng hợp từ các tháng đã lưu)</h4>
        <ul id="stats-list"></ul>
    </div>

    <div class="table-container" id="output">
        </div>
    
    <div id="next-month-info"></div>
</div>

<script>
    const STORAGE_KEY = 'trucNhatDataV2';
    const PASS_KEY = 'admin_password_secret'; // Key lưu mật khẩu
    let currentMonthData = null; 

    // --- CÁC HÀM XỬ LÝ BẢO MẬT & ĐĂNG NHẬP ---
    window.onload = function() {
        // Kiểm tra xem đã đăng nhập trong phiên làm việc (session) chưa
        if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
            showAdminWorkspace();
        }
    };

    function handleLoginKeyPress(e) {
        if (e.key === 'Enter') { verifyLogin(); }
    }

    function verifyLogin() {
        let inputPass = document.getElementById('admin-pass-input').value;
        let correctPass = localStorage.getItem(PASS_KEY) || 'admin123'; // Lấy pass đã lưu hoặc dùng mặc định

        if (inputPass === correctPass) {
            sessionStorage.setItem('isAdminLoggedIn', 'true');
            showAdminWorkspace();
        } else {
            alert('❌ Sai mật khẩu! Vui lòng thử lại.');
        }
    }

    function showAdminWorkspace() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('main-admin-section').style.display = 'block';
        
        // Load dữ liệu lịch như cũ
        updateStartPersonList();
        updateSavedMonthsDropdown();
        let m = document.getElementById('month').value;
        let y = document.getElementById('year').value;
        let id = `${y}-${m.padStart(2, '0')}`;
        
        let allData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        if (allData[id]) {
            currentMonthData = allData[id];
            renderTableFromData();
        } else {
            generateAndSaveNewSchedule();
        }
    }

    function logoutAdmin() {
        sessionStorage.removeItem('isAdminLoggedIn');
        location.reload(); // Tải lại trang để về màn hình đăng nhập
    }

    function changePassword() {
        let currentCorrectPass = localStorage.getItem(PASS_KEY) || 'admin123';
        
        let oldPass = prompt('Vui lòng nhập mật khẩu HIỆN TẠI:');
        if (oldPass === null) return; // Nhấn Cancel
        
        if (oldPass !== currentCorrectPass) {
            alert('❌ Mật khẩu hiện tại không đúng!');
            return;
        }

        let newPass = prompt('Nhập mật khẩu MỚI:');
        if (newPass === null || newPass.trim() === '') {
            alert('❌ Mật khẩu mới không được để trống!');
            return;
        }

        let confirmPass = prompt('Nhập LẠI mật khẩu mới để xác nhận:');
        if (confirmPass !== newPass) {
            alert('❌ Mật khẩu xác nhận không khớp!');
            return;
        }

        localStorage.setItem(PASS_KEY, newPass);
        alert('✅ Đổi mật khẩu thành công! Hãy ghi nhớ mật khẩu mới của bạn.');
    }

    // --- CÁC HÀM XỬ LÝ LỊCH (Giữ nguyên như cũ) ---
    function updateStartPersonList() {
        const namesInput = document.getElementById('names').value;
        const names = namesInput.split('\n').map(n => n.trim()).filter(n => n !== '');
        const select = document.getElementById('startPerson');
        const currentSelection = select.value;
        
        select.innerHTML = '';
        names.forEach(name => {
            let option = document.createElement('option');
            option.value = name;
            option.textContent = name;
            select.appendChild(option);
        });
        if (names.includes(currentSelection)) select.value = currentSelection;
    }

    function updateSavedMonthsDropdown() {
        let allData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        const select = document.getElementById('savedMonths');
        select.innerHTML = '';
        let keys = Object.keys(allData).sort().reverse(); 
        
        if (keys.length === 0) {
            let opt = document.createElement('option');
            opt.textContent = "Chưa có dữ liệu lưu";
            select.appendChild(opt);
            return;
        }

        keys.forEach(key => {
            let opt = document.createElement('option');
            opt.value = key;
            opt.textContent = `Tháng ${allData[key].month}/${allData[key].year}`;
            select.appendChild(opt);
        });
    }

    function generateAndSaveNewSchedule() {
        const names = document.getElementById('names').value.split('\n').map(n => n.trim()).filter(n => n !== '');
        const month = parseInt(document.getElementById('month').value);
        const year = parseInt(document.getElementById('year').value);
        const startPersonName = document.getElementById('startPerson').value;
        const holidaysInput = document.getElementById('holidays').value;
        const holidayDates = holidaysInput.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));

        if (names.length === 0) { alert("Vui lòng nhập tên."); return; }

        const daysInMonth = new Date(year, month, 0).getDate();
        let assignments = {};
        let missed = {}; 
        names.forEach(n => { assignments[n] = {}; missed[n] = {}; });
        
        let currentPersonIdx = names.indexOf(startPersonName);
        if (currentPersonIdx === -1) currentPersonIdx = 0;

        let isWeekend = [];
        let isHoliday = [];

        for (let i = 1; i <= daysInMonth; i++) {
            let day = new Date(year, month - 1, i).getDay();
            let weekend = (day === 0 || day === 6);
            let holiday = holidayDates.includes(i);
            
            isWeekend[i] = weekend;
            isHoliday[i] = holiday;

            if (!weekend && !holiday) {
                let assignedPerson = names[currentPersonIdx];
                assignments[assignedPerson][i] = true;
                currentPersonIdx = (currentPersonIdx + 1) % names.length; 
            }
        }

        let nextPerson = names[currentPersonIdx];

        currentMonthData = {
            id: `${year}-${month.toString().padStart(2, '0')}`,
            month: month,
            year: year,
            names: names,
            daysInMonth: daysInMonth,
            isWeekend: isWeekend,
            isHoliday: isHoliday,
            assignments: assignments,
            missed: missed, 
            nextPersonForNextMonth: nextPerson
        };

        saveDataToStorage();
        updateSavedMonthsDropdown();
        renderTableFromData();
    }

    function renderTableFromData() {
        if (!currentMonthData) return;
        
        const { month, year, names, daysInMonth, isWeekend, isHoliday, assignments, missed, nextPersonForNextMonth } = currentMonthData;
        
        let html = `<table>`;
        html += `<tr><th colspan="${daysInMonth + 1}" style="font-size: 16px; padding: 10px; text-transform: uppercase;">BẢNG PHÂN CÔNG TRỰC NHẬT THÁNG ${month}/${year}</th></tr>`;
        
        html += `<tr><th rowspan="2" class="name-col" style="width: 200px;">Họ và tên</th>`;
        for (let i = 1; i <= daysInMonth; i++) html += `<th>${i < 10 ? '0'+i : i}</th>`;
        html += `</tr><tr>`;

        for (let i = 1; i <= daysInMonth; i++) {
            let day = new Date(year, month - 1, i).getDay();
            let dayStr = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][day];
            let bgClass = isHoliday[i] ? 'class="holiday" title="Nghỉ lễ"' : (isWeekend[i] ? 'class="weekend" title="Cuối tuần"' : '');
            html += `<th ${bgClass}>${dayStr}</th>`;
        }
        html += `</tr>`;

        names.forEach(name => {
            html += `<tr><td class="name-col">${name}</td>`;
            for (let i = 1; i <= daysInMonth; i++) {
                let tdClass = '';
                if (isHoliday[i]) tdClass = 'holiday';
                else if (isWeekend[i]) tdClass = 'weekend';

                let isAssigned = assignments[name] && assignments[name][i];
                let isMissed = missed[name] && missed[name][i];
                let mark = '';
                let onClick = '';

                if (isAssigned) {
                    let textMark = isMissed ? 'Vắng' : 'X';
                    onClick = `onclick="toggleMissed('${name}', ${i})" class="clickable-cell ${tdClass} ${isMissed ? 'missed' : ''}" title="Click để đánh dấu vắng mặt"`;
                    mark = `<b>${textMark}</b>`;
                } else {
                    onClick = `class="${tdClass}"`; 
                }

                html += `<td ${onClick}>${mark}</td>`;
            }
            html += `</tr>`;
        });

        html += `</table>`;
        html += `<div class="note-text"><i>* Mẹo: Nhấp chuột vào chữ <b>X</b> để đánh dấu là <b>Vắng</b> (bỏ trực).</i></div>`;
        document.getElementById('output').innerHTML = html;
        document.getElementById('next-month-info').innerHTML = `Ghi chú: Người trực ca đầu tiên của tháng sau sẽ là <b>${nextPersonForNextMonth}</b>`;
    }

    function toggleMissed(name, day) {
        if (!currentMonthData.missed[name]) currentMonthData.missed[name] = {};
        currentMonthData.missed[name][day] = !currentMonthData.missed[name][day];
        saveDataToStorage(); 
        renderTableFromData(); 
        if (document.getElementById('stats-box').style.display === 'block') {
            generateStats();
        }
    }

    function saveDataToStorage() {
        let allData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        allData[currentMonthData.id] = currentMonthData;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    }

    function loadSelectedSchedule() {
        let selectedId = document.getElementById('savedMonths').value;
        if (!selectedId) return;
        
        let allData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        if (allData[selectedId]) {
            currentMonthData = allData[selectedId];
            document.getElementById('month').value = currentMonthData.month;
            document.getElementById('year').value = currentMonthData.year;
            document.getElementById('names').value = currentMonthData.names.join('\n');
            
            let holidaysStr = [];
            for (let i=1; i<=currentMonthData.daysInMonth; i++) {
                if(currentMonthData.isHoliday[i]) holidaysStr.push(i);
            }
            document.getElementById('holidays').value = holidaysStr.join(', ');
            
            updateStartPersonList();
            renderTableFromData();
        }
    }

    function generateNextMonth() {
        if (!currentMonthData) { alert("Vui lòng tạo bảng hiện tại trước!"); return; }

        let m = currentMonthData.month + 1;
        let y = currentMonthData.year;
        if (m > 12) { m = 1; y++; }
        
        document.getElementById('month').value = m;
        document.getElementById('year').value = y;
        document.getElementById('holidays').value = ""; 
        document.getElementById('startPerson').value = currentMonthData.nextPersonForNextMonth; 

        generateAndSaveNewSchedule();
    }

    function toggleStats() {
        let box = document.getElementById('stats-box');
        if (box.style.display === 'none' || box.style.display === '') {
            generateStats();
            box.style.display = 'block';
        } else {
            box.style.display = 'none';
        }
    }

    function generateStats() {
        let allData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        let stats = {};
        const currentNames = document.getElementById('names').value.split('\n').map(n => n.trim()).filter(n => n !== '');
        currentNames.forEach(n => stats[n] = 0);

        for (let monthId in allData) {
            let mData = allData[monthId];
            for (let name in mData.missed) {
                for (let day in mData.missed[name]) {
                    if (mData.missed[name][day]) {
                        stats[name] = (stats[name] || 0) + 1;
                    }
                }
            }
        }

        let ul = document.getElementById('stats-list');
        ul.innerHTML = '';
        let hasMissed = false;

        let sortedNames = Object.keys(stats).sort((a, b) => stats[b] - stats[a]);

        sortedNames.forEach(name => {
            if (stats[name] > 0) {
                ul.innerHTML += `<li><b>${name}</b>: Đã bỏ trực <b style="color:red">${stats[name]}</b> lần</li>`;
                hasMissed = true;
            }
        });

        if (!hasMissed) {
            ul.innerHTML = `<li>Chưa có ai bỏ trực nhật (hoặc chưa có dữ liệu đánh dấu).</li>`;
        }
    }
</script>

</body>
</html>
